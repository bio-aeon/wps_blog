name: Scala Steward

# Dependency updates for blog-api; Dependabot has no sbt ecosystem.

on:
  schedule:
    # Monday 06:00 UTC, matching the Dependabot cadence.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scala-steward:

    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Run Scala Steward
      uses: scala-steward-org/scala-steward-action@v2.96.0
      with:
        github-app-id: ${{ secrets.APP_ID }}
        github-app-installation-id: ${{ secrets.APP_INSTALLATION_ID }}
        github-app-key: ${{ secrets.APP_PRIVATE_KEY }}
        github-app-auth-only: true
        branches: master
