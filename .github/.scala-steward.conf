buildRoots = [ "blog-api" ]

pullRequests.frequency = "7 days"

# tofu-doobie is still built against org.tpolecat RC12; unpin when tofu supports RC13.
updates.pin = [ { groupId = "org.tpolecat", artifactId = "doobie-core", version = "1.0.0-RC12" } ]

commits.message = "Chore(API): updating ${artifactName} from ${currentVersion} to ${nextVersion}"
